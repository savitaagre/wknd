version: 1

indices:
  # Site-wide content index → /query-index.json.
  #
  # Every migrated page of every locale (/us/en, /ca/en and the coming-soon
  # locale homes /us/es, /ca/fr, /ch/*, /de/de, /fr/fr, /es/es, /it/it).
  # Chrome and non-page documents are excluded: per-locale nav/footer,
  # /fragments (Sign In modal), /drafts and /docs.
  #
  # Readers: the ai-search block (search over the whole site) and
  # helix-sitemap.yaml (one /sitemap.xml with every page).
  content:
    include:
      - '/us/**'
      - '/ca/**'
      - '/ch/**'
      - '/de/**'
      - '/fr/**'
      - '/es/**'
      - '/it/**'
    exclude:
      - '**/nav'
      - '**/footer'
      - '/fragments/**'
      - '/drafts/**'
      - '/docs/**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
