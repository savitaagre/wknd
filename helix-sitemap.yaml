# Sitemap config for the WKND EDS site.
#
# Replaces the platform default sitemap (which wrongly listed /footer and /nav
# fragments as pages). Builds /sitemap.xml from the site-wide query index only,
# so it contains real pages and nothing else: every migrated page of every
# locale (/us/en, /ca/en and the coming-soon locale homes) — nav, footer,
# fragments, drafts and docs are excluded in helix-query.yaml.
#
# Update `origin` to the real production domain once one exists.

sitemaps:
  default:
    origin: https://main--wknd--savitaagre.aem.live
    source: /query-index.json
    destination: /sitemap.xml
